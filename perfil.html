<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="perfil.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <img class="logo" src="logo.png" alt="Logo" />
      <div class="links">
        <a href="index.html">Login</a>
        <a href="consulta.html">Consulta</a>
        <a href="detalle.html">Detalle</a>
        <a href="escanear.html">Escanear</a>
        <a href="mapa.html">Mapa</a>
        <a href="perfil.html" class="active">Perfil</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="profile max-w-md">
      <header class="profile-head">
        <div class="profile-brand-strip" aria-hidden="true"></div>
        <div class="profile-avatar-wrap">
          <!-- Reemplaza la imagen por la del usuario -->
          <img class="profile-avatar" src="Foto.png" alt="" />
        </div>
        <h1 class="profile-title h2">PERFIL</h1>
        <p class="profile-name">Kamilo Andrés</p>
      </header>

      <nav class="profile-actions" aria-label="acciones de perfil">
        <a class="profile-item" href="restablecer.html">
          <span class="profile-icon">
            <!-- icono llave -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.5 14A4.5 4.5 0 1 1 9 5.1V5a4 4 0 1 1 6.7 2.9l-2.4 2.4H11v2H9v2H7.5Z"/>
            </svg>
          </span>
          <span class="profile-text">Cambiar Contraseña</span>
        </a>

        <a class="profile-item" href="#informacion">
          <span class="profile-icon">
            <!-- icono info -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a10 10 0 1 0 .001 20.001A10 10 0 0 0 12 2Zm1 15h-2v-6h2v6Zm0-8h-2V7h2v2Z"/>
            </svg>
          </span>
          <span class="profile-text">Información</span>
        </a>

        <a class="profile-item" href="#contratos">
          <span class="profile-icon">
            <!-- icono documento -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6"/>
              <path d="M8 13h8M8 17h8M8 9h4"/>
            </svg>
          </span>
          <span class="profile-text">Mis Contratos</span>
        </a>

        <button class="profile-item profile-item--danger" id="logoutBtn" type="button">
          <span class="profile-icon">
            <!-- icono salir -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17l-1.4-1.4 3.6-3.6-3.6-3.6L10 7l5 5-5 5Z"/>
              <path d="M4 4h7v2H6v12h5v2H4z"/>
            </svg>
          </span>
          <span class="profile-text">Cerrar Sesión</span>
        </button>
      </nav>
    </section>
  </main>

  <script src="perfil.js"></script>
</body>
</html>
