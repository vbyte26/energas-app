<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar Sesión</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
<nav class="navbar" aria-label="principal">
<img class="logo" src="logo.png" alt="Logo" />
<div class="links">
<a href="index.html" class="active" aria-current="page">Login</a>
<a href="consulta.html">Consulta</a>
<a href="detalle.html">Detalle</a>
<a href="escanear.html">Escanear</a>
<a href="mapa.html">Mapa</a>
<a href="perfil.html" class="active">Perfil</a>
</div>
</nav>
</header>


<main class="container">
<div class="login-wrap">
<div class="login-card" role="region" aria-labelledby="titulo-login">
<h1 id="titulo-login" class="login-title">Iniciar Sesión</h1>
<form class="login-form" id="loginForm" novalidate>
<div class="form-group">
<label class="label" for="usuario">Usuario</label>
<input class="input" id="usuario" name="usuario" type="text" inputmode="text" placeholder="Ingresa tu usuario." autocomplete="username" required>
</div>


<div class="form-group input-password">
<label class="label" for="password">Contraseña</label>
<input class="input" id="password" name="password" type="password" placeholder="Ingresa tu contraseña." autocomplete="current-password" required>
<button type="button" class="pwd-toggle" aria-label="Mostrar u ocultar contraseña" aria-controls="password" aria-pressed="false">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="1.6"/>
<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.6"/>
</svg>
</button>
</div>


<button class="btn-primary" type="submit">Iniciar Sesión</button>
</form>
</div>
</div>
</main>


<script src="app.js"></script>
</body>
</html>
